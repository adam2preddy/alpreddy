<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adam Preddy</title>
    <style>
        body {
            background-color: #006bb6;
            font-family: Arial, Helvetica, sans-serif;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }
        h1 {
            color: #f58426;
            font-size: 3em;
            margin-bottom: 20px;
        }
        img {
            width: 200px;
            height: 300px;
            object-fit: cover;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
        }
        .about-label {
            color: #ffffff;
            font-size: 1.5em;
            font-weight: bold;
            margin-top: 30px;
        }
        .bio {
            color: #ffffff;
            max-width: 500px;
            line-height: 1.6;
        }
    </style>
</head>
<body>
    <h1>Adam Preddy</h1>
    <img src="me.jpeg" alt="Portrait photo of Adam Preddy smiling">
    <div class="about-label">About Me</div>
    <p class="bio">
        Hi, I'm Adam, a student who loves learning new things.<br>
        I enjoy technology, creativity, and meeting new people.<br>
        Thanks for stopping by my page!
    </p>
</body>
</html>
